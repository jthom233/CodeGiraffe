name: CodeGiraffe Architectural Review

on:
  pull_request:
    branches: [main]

env:
  BLAST_RADIUS_THRESHOLD: 10  # PRs whose total blast radius exceeds this are flagged in the comment

jobs:
  architectural-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for the base-ref diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CodeGiraffe from this checkout
        run: pip install .

      - name: Analyze change impact
        run: |
          python .github/scripts/architectural-review.py \
            "origin/${{ github.base_ref }}" review-results.json

      - name: Post PR comment
        if: always() && hashFiles('review-results.json') != ''
        run: |
          python .github/scripts/format-pr-comment.py review-results.json \
            | gh pr comment ${{ github.event.pull_request.number }} --body-file -
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
