[project]
name = "codegiraffe"
version = "0.5.0"
description = "Architecture knowledge graph MCP server for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Jon Thompson", email = "jthom233@yahoo.com" },
]
keywords = ["mcp", "architecture", "knowledge-graph", "ai", "code-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "networkx>=3.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/jthom233/CodeGiraffe"
Repository = "https://github.com/jthom233/CodeGiraffe"
Issues = "https://github.com/jthom233/CodeGiraffe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
embeddings = [
    "sentence-transformers>=2.0",
]
neo4j = [
    "neo4j>=6.0",
]
ast = [
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-java>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegiraffe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
