[project]
name = "codegiraffe"
version = "0.1.0"
description = "Architecture knowledge graph MCP server for AI-assisted development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "networkx>=3.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
embeddings = [
    "sentence-transformers>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegiraffe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
